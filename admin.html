<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | IT-LYCEUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .border-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; transition: 0.3s; }
        .hidden { display: none !important; }
        body { background: #fafafa; font-family: 'Inter', sans-serif; color: #1e293b; }
        
        .tab-btn { border-bottom: 2px solid transparent; color: #64748b; }
        .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">
    
    <div id="login-screen" class="max-w-md mx-auto mt-10 sm:mt-20 border-card p-6 sm:p-10">
        <h2 class="text-2xl font-black mb-6 uppercase italic text-center sm:text-left">Security Access</h2>
        <input type="email" id="email" placeholder="Email (Admin)" class="w-full mb-4 p-3 border rounded-xl bg-slate-50 outline-none text-sm sm:text-base">
        <input type="password" id="password" placeholder="Пароль" class="w-full mb-6 p-3 border rounded-xl bg-slate-50 outline-none text-sm sm:text-base">
        <button id="login-btn" class="w-full bg-slate-900 text-white p-4 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-brand-600 transition shadow-sm">Вход</button>
    </div>

    <div id="admin-dashboard" class="hidden max-w-[800px] mx-auto">
        
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 pb-6 border-b border-slate-200 gap-4">
            <h1 class="text-2xl sm:text-3xl font-black uppercase italic tracking-tighter">Admin Panel</h1>
            <div class="flex w-full sm:w-auto justify-center gap-4">
                <a href="index.html" class="flex-1 sm:flex-none text-center text-[10px] font-black text-brand-600 uppercase border border-brand-100 px-4 py-2.5 rounded-xl hover:bg-brand-50 transition">На сайт</a>
                <button id="logout-btn" class="flex-1 sm:flex-none text-center text-[10px] font-black text-red-500 uppercase border border-red-100 px-4 py-2.5 rounded-xl hover:bg-red-50 transition">Выход</button>
            </div>
        </div>

        <div class="flex gap-6 mb-8 border-b border-slate-200 px-2 overflow-x-auto custom-scrollbar">
            <button id="tab-btn-news" class="tab-btn active pb-3 font-black uppercase tracking-widest text-xs whitespace-nowrap transition">Новости</button>
            <button id="tab-btn-reception" class="tab-btn pb-3 font-black uppercase tracking-widest text-xs whitespace-nowrap transition">Приемная</button>
            <button id="tab-btn-schedule" class="tab-btn pb-3 font-black uppercase tracking-widest text-xs whitespace-nowrap transition">Уроки</button>
        </div>

        <div id="tab-news" class="border-card p-6 sm:p-8">
            <h3 class="text-lg font-black uppercase italic mb-6">Опубликовать новость</h3>
            
            <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-2">Обложка новости (Фото)</label>
            <input type="file" id="news-image" accept="image/*" class="w-full mb-4 p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 cursor-pointer">
            
            <input type="text" id="news-title" placeholder="Заголовок новости" class="w-full mb-3 p-3 border rounded-xl text-sm font-bold outline-none focus:border-brand-500 transition">
            <textarea id="news-body" placeholder="Текст сообщения..." class="w-full mb-4 p-3 border rounded-xl text-sm min-h-[160px] outline-none focus:border-brand-500 transition"></textarea>
            
            <button id="post-news-btn" class="w-full bg-brand-600 text-white p-4 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-brand-700 transition shadow-sm">Опубликовать</button>
            <p id="upload-status" class="mt-4 text-center text-sm font-black uppercase text-brand-600"></p>
        </div>

        <div id="tab-reception" class="hidden">
            <h3 class="text-lg font-black uppercase italic mb-6 px-2">Обращения пользователей</h3>
            <div id="reception-container" class="space-y-4">
                <p class="text-slate-400 italic font-medium px-2">Загрузка обращений...</p>
            </div>
        </div>

        <div id="tab-schedule" class="hidden border-card p-6 sm:p-8">
            <h3 class="text-lg font-black uppercase italic mb-4">Настройка звонков</h3>
            <p class="text-xs text-slate-500 mb-6 font-medium leading-relaxed">Выберите длительность уроков на сегодня. При наступлении следующего дня система <span class="font-bold text-brand-600">автоматически вернет</span> стандартные 45 минут.</p>
            
            <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-2">Пресет длительности</label>
            <select id="lesson-duration-select" class="w-full mb-6 p-3 border border-slate-200 rounded-xl text-sm font-bold bg-slate-50 outline-none focus:border-brand-500 transition cursor-pointer">
                <option value="45">45 минут (Стандарт)</option>
                <option value="40">40 минут (Сокращенные перемены)</option>
                <option value="35">35 минут (Сокращенные перемены)</option>
                <option value="30">30 минут (Сокращенные перемены)</option>
            </select>
            
            <button id="save-schedule-btn" class="w-full bg-slate-900 text-white p-4 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-brand-600 transition shadow-sm">Сохранить изменения</button>
            <p id="schedule-status" class="mt-4 text-center text-sm font-black uppercase text-brand-600"></p>
        </div>

    </div>
    
    <script type="module" src="js/admin.js"></script>
</body>
</html>
